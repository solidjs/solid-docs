# Spike: release-age gate off so Solid 2 RC/alpha deps install (Ryan, 2026-10-27).
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "solid-js"
  - "@solidjs/*"
  - "@kobalte/solidbase"
  - "vite"
  - "@solidjs/router"
packages:
  - "."
  - "osmium"

catalog:
  "@kobalte/solidbase": ^0.6.13

allowBuilds:
  esbuild: true

overrides:
  # SolidBase 2.0.0 pins 0.4.0; 0.4.2 maps (0)index pages to their directory.
  "filesystem-routing": "0.4.2"
  # SolidBase 2.0.0 pins router next.37; keep one router copy.
  "@solidjs/router": "2.0.0-next.42"
  # One Solid runtime for the site and its Solid 2 libraries.
  "solid-js": "2.0.0-rc.19"
  "@solidjs/web": "2.0.0-rc.19"
