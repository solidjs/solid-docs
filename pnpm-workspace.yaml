# Spike: release-age gate off so Solid 2 RC/alpha deps install (Ryan, 2026-10-27).
minimumReleaseAge: 0
minimumReleaseAgeExclude:
  - "solid-js"
  - "@solidjs/*"
  - "@kobalte/solidbase"
  - "vite"
  - "@solidjs/router"
packages:
  - "."
  - "osmium"

catalog:
  "@kobalte/solidbase": ^0.6.13

allowBuilds:
  esbuild: true


# Spike: solidjs/filesystem-routing#36 ((0)index pages map to /index without it).
overrides:
  "filesystem-routing": "file:./spike/filesystem-routing-0.4.1.tgz"
