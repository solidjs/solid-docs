<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 1200 675"
	role="img"
	aria-labelledby="title description"
>
	<title id="title">What stays mounted on a nested navigation</title>
	<desc id="description">
		Two columns show the component tree for /account/profile and
		/account/orders. The Router function child and the AccountLayout are the
		same instance in both columns and are marked kept. Only the page level,
		Profile in the first column and Orders in the second, is disposed and
		created.
	</desc>

	<defs>
		<marker
			id="arrow"
			viewBox="0 0 10 10"
			refX="9"
			refY="5"
			markerWidth="8"
			markerHeight="8"
			orient="auto-start-reverse"
		>
			<path d="M0 0 10 5 0 10z" fill="#0f2b55" />
		</marker>
	</defs>

	<rect width="1200" height="675" rx="24" fill="#ffffff" />

	<g
		font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
		fill="#0f172a"
	>
		<text x="600" y="62" text-anchor="middle" font-size="36" font-weight="750">
			Only the level that changed is replaced
		</text>

		<g text-anchor="middle" font-size="20" font-weight="700" fill="#334155">
			<text x="300" y="118">/account/profile</text>
			<text x="900" y="118">/account/orders</text>
		</g>

		<path
			d="M470 118h255"
			fill="none"
			stroke="#0f2b55"
			stroke-width="3"
			marker-end="url(#arrow)"
		/>
		<text x="597" y="108" text-anchor="middle" font-size="15" font-weight="650" fill="#0f2b55">
			click Orders
		</text>

		<!-- Level 1: Router function child -->
		<g stroke="#0f2b55" stroke-width="3" fill="#f8fafc">
			<rect x="90" y="150" width="420" height="120" rx="14" />
			<rect x="690" y="150" width="420" height="120" rx="14" />
		</g>
		<g text-anchor="middle">
			<text x="300" y="196" font-size="22" font-weight="700">Router function child</text>
			<text x="300" y="228" font-size="17" fill="#475569">app shell, providers</text>
			<text x="900" y="196" font-size="22" font-weight="700">Router function child</text>
			<text x="900" y="228" font-size="17" fill="#475569">app shell, providers</text>
		</g>

		<!-- Level 2: AccountLayout -->
		<g stroke="#0f2b55" stroke-width="3" fill="#f8fafc">
			<rect x="130" y="300" width="340" height="140" rx="14" />
			<rect x="730" y="300" width="340" height="140" rx="14" />
		</g>
		<g text-anchor="middle">
			<text x="300" y="346" font-size="22" font-weight="700">AccountLayout</text>
			<text x="300" y="378" font-size="17" fill="#475569">
				<tspan x="300">nav, search box text,</tspan>
				<tspan x="300" dy="24">signals created here</tspan>
			</text>
			<text x="900" y="346" font-size="22" font-weight="700">AccountLayout</text>
			<text x="900" y="378" font-size="17" fill="#475569">
				<tspan x="900">nav, search box text,</tspan>
				<tspan x="900" dy="24">signals created here</tspan>
			</text>
		</g>

		<!-- Level 3: page -->
		<g stroke="#2563eb" stroke-width="2.5" fill="#eff6ff">
			<rect x="170" y="470" width="260" height="110" rx="14" />
			<rect x="770" y="470" width="260" height="110" rx="14" />
		</g>
		<g text-anchor="middle">
			<text x="300" y="516" font-size="22" font-weight="700">Profile</text>
			<text x="300" y="548" font-size="17" fill="#475569">page state resets</text>
			<text x="900" y="516" font-size="22" font-weight="700">Orders</text>
			<text x="900" y="548" font-size="17" fill="#475569">page state starts fresh</text>
		</g>

		<!-- connectors between levels -->
		<g fill="none" stroke="#94a3b8" stroke-width="2">
			<path d="M300 270v30" />
			<path d="M300 440v30" />
			<path d="M900 270v30" />
			<path d="M900 440v30" />
		</g>

		<!-- kept badges spanning the columns -->
		<g fill="#0f2b55">
			<rect x="530" y="193" width="140" height="34" rx="8" />
			<rect x="530" y="353" width="140" height="34" rx="8" />
		</g>
		<g text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">
			<text x="600" y="216">same instance</text>
			<text x="600" y="376">same instance</text>
		</g>
		<g fill="none" stroke="#0f2b55" stroke-width="2" stroke-dasharray="5 5">
			<path d="M510 210h20" />
			<path d="M670 210h20" />
			<path d="M470 370h60" />
			<path d="M670 370h60" />
		</g>

		<!-- replaced badge -->
		<rect x="520" y="508" width="160" height="34" rx="8" fill="#2563eb" />
		<text x="600" y="531" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">
			disposed, created
		</text>
		<g fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="5 5">
			<path d="M430 525h90" />
			<path d="M680 525h90" />
		</g>

		<text x="600" y="635" text-anchor="middle" font-size="19" fill="#334155">
			A route's component lives as long as its definition is part of the match; /account/orders/42 to /43 keeps Order mounted too.
		</text>
	</g>
</svg>
