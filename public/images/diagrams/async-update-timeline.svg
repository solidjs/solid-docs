<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 1200 675"
	role="img"
	aria-labelledby="title description"
>
	<title id="title">How async updates become visible</title>
	<desc id="description">
		A timeline showing a Loading fallback during the first request, Answer A
		remaining visible while the next request is held, and Answer B appearing
		when that request settles.
	</desc>

	<rect width="1200" height="675" rx="24" fill="#ffffff" />

	<g
		font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
		fill="#0f172a"
	>
		<text x="600" y="60" text-anchor="middle" font-size="34" font-weight="700">
			How async updates become visible
		</text>

		<g font-size="18" font-weight="650" text-anchor="middle">
			<text x="210" y="112">First read</text>
			<text x="460" y="98">
				<tspan x="460" dy="0">First answer</tspan>
				<tspan x="460" dy="24">commits</tspan>
			</text>
			<text x="745" y="98">
				<tspan x="745" dy="0">Input</tspan>
				<tspan x="745" dy="24">changes</tspan>
			</text>
			<text x="990" y="98">
				<tspan x="990" dy="0">Next answer</tspan>
				<tspan x="990" dy="24">commits</tspan>
			</text>
		</g>

		<g stroke="#2563eb" stroke-width="2">
			<line x1="210" y1="132" x2="210" y2="470" />
			<line x1="460" y1="132" x2="460" y2="470" />
			<line x1="745" y1="132" x2="745" y2="470" />
			<line x1="990" y1="132" x2="990" y2="470" />
		</g>

		<g fill="#2563eb">
			<circle cx="210" cy="132" r="7" />
			<circle cx="460" cy="132" r="7" />
			<circle cx="745" cy="132" r="7" />
			<circle cx="990" cy="132" r="7" />
		</g>

		<g font-size="22" font-weight="700">
			<text x="28" y="242">Visible UI</text>
			<text x="28" y="402">Async work</text>
		</g>

		<g stroke="#1e3a5f" stroke-width="1.5">
			<rect x="210" y="182" width="250" height="108" fill="#eff6ff" />
			<rect x="460" y="182" width="530" height="108" fill="#3b82f6" />
			<rect x="990" y="182" width="150" height="108" fill="#eff6ff" />

			<rect x="210" y="342" width="250" height="108" fill="#eff6ff" />
			<rect x="460" y="342" width="285" height="108" fill="#ffffff" />
			<rect x="745" y="342" width="245" height="108" fill="#dbeafe" />
			<rect x="990" y="342" width="150" height="108" fill="#ffffff" />
		</g>

		<g font-size="20" font-weight="600" text-anchor="middle">
			<text x="335" y="244">Loading fallback</text>
			<text x="725" y="244" fill="#ffffff">Answer A</text>
			<text x="1065" y="244">Answer B</text>

			<text x="335" y="404">First request</text>
			<text x="602.5" y="404">Idle</text>
			<text x="867.5" y="404">Next request in flight</text>
			<text x="1065" y="404">Settled</text>
		</g>

		<path
			d="M745 485v12h98c12 0 16 10 24.5 18 8.5-8 12.5-18 24.5-18h98v-12"
			fill="none"
			stroke="#2563eb"
			stroke-width="2.5"
		/>
		<text
			x="867.5"
			y="542"
			text-anchor="middle"
			font-size="18"
			font-weight="700"
			fill="#1d4ed8"
		>
			Held update | isPending = true
		</text>

		<g font-size="18" text-anchor="middle">
			<text x="335" y="582">
				<tspan x="335" dy="0">No settled answer:</tspan>
				<tspan x="335" dy="25">Loading supplies fallback UI.</tspan>
			</text>
			<text x="867.5" y="582">
				<tspan x="867.5" dy="0">Answer A remains committed</tspan>
				<tspan x="867.5" dy="25">while Answer B is prepared.</tspan>
			</text>
		</g>
	</g>
</svg>
