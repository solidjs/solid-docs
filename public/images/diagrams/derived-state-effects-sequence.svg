<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 1200 675"
	role="img"
	aria-labelledby="title description"
>
	<title id="title">Keep effects at the edge</title>
	<desc id="description">
		Reactive inputs flow through derivations to declarative consumers and
		terminal effects. User interactions and external observations use setters
		to create new reactive inputs.
	</desc>

	<defs>
		<marker
			id="arrow"
			viewBox="0 0 10 10"
			refX="9"
			refY="5"
			markerWidth="8"
			markerHeight="8"
			orient="auto-start-reverse"
		>
			<path d="M0 0 10 5 0 10z" fill="#2563eb" />
		</marker>
	</defs>

	<rect width="1200" height="675" rx="24" fill="#ffffff" />

	<g
		font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
		fill="#0f172a"
	>
		<text x="600" y="62" text-anchor="middle" font-size="36" font-weight="750">
			Keep effects at the edge
		</text>

		<g stroke="#2563eb" stroke-width="2.5" fill="#eff6ff">
			<rect x="40" y="170" width="220" height="150" rx="14" />
			<rect x="315" y="150" width="290" height="190" rx="14" />
			<rect x="660" y="170" width="220" height="150" rx="14" />
		</g>

		<rect
			x="935"
			y="170"
			width="225"
			height="150"
			rx="14"
			fill="#f8fafc"
			stroke="#0f2b55"
			stroke-width="3"
		/>

		<g
			fill="none"
			stroke="#2563eb"
			stroke-width="3"
			marker-end="url(#arrow)"
		>
			<path d="M260 245h47" />
			<path d="M605 245h47" />
			<path d="M880 245h47" />
		</g>

		<g text-anchor="middle">
			<text x="150" y="225" font-size="22" font-weight="700">Reactive inputs</text>
			<text x="150" y="258" font-size="17" fill="#475569">
				<tspan x="150">props / signals / stores</tspan>
			</text>

			<text x="460" y="212" font-size="22" font-weight="700">Derived graph</text>
			<text x="460" y="248" font-size="17" fill="#475569">
				<tspan x="460">functions / memos</tspan>
				<tspan x="460" dy="25">async computations</tspan>
				<tspan x="460" dy="25">writable derivations</tspan>
			</text>

			<text x="770" y="225" font-size="22" font-weight="700">
				<tspan x="770">Declarative</tspan>
				<tspan x="770" dy="28">consumers</tspan>
			</text>
			<text x="770" y="295" font-size="17" fill="#475569">JSX / render work</text>

			<rect x="978" y="112" width="140" height="34" rx="8" fill="#0f2b55" />
			<text x="1048" y="135" font-size="15" font-weight="700" fill="#ffffff">
				after settlement
			</text>
			<path
				d="M1048 146v20"
				fill="none"
				stroke="#0f2b55"
				stroke-width="2"
				stroke-dasharray="4 4"
			/>

			<text x="1047.5" y="225" font-size="22" font-weight="700">
				Terminal effect
			</text>
			<text x="1047.5" y="258" font-size="17" fill="#475569">
				<tspan x="1047.5">imperative external</tspan>
				<tspan x="1047.5" dy="24">system</tspan>
			</text>
		</g>

		<text x="600" y="390" text-anchor="middle" font-size="19" fill="#334155">
			Keep values in the graph until they reach a declarative consumer or leave Solid.
		</text>

		<g stroke="#2563eb" stroke-width="2" fill="#eff6ff">
			<rect x="330" y="440" width="185" height="58" rx="11" />
			<rect x="565" y="440" width="225" height="58" rx="11" />
			<rect x="840" y="440" width="115" height="58" rx="11" />

			<rect x="330" y="545" width="185" height="58" rx="11" />
			<rect x="565" y="545" width="115" height="58" rx="11" />
		</g>

		<g font-size="17" font-weight="650" text-anchor="middle">
			<text x="422.5" y="476">User interaction</text>
			<text x="677.5" y="476">event handler or action</text>
			<text x="897.5" y="476">setter</text>
			<text x="422.5" y="581">External observation</text>
			<text x="622.5" y="581">setter</text>
		</g>

		<g
			fill="none"
			stroke="#2563eb"
			stroke-width="2.5"
			marker-end="url(#arrow)"
		>
			<path d="M515 469h42" />
			<path d="M790 469h42" />
			<path d="M515 574h42" />
			<path d="M955 469h117" />
			<path d="M680 574h392" />
			<path d="M1080 574V370q0-35-35-35H185q-35 0-35-8" />
		</g>

		<g fill="#1d4ed8" font-size="15" font-weight="650">
			<text x="1005" y="444">new input</text>
			<text x="1005" y="552">new input</text>
		</g>
	</g>
</svg>
