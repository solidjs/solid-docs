[build]
  publish = "dist/client/"

# "SolidStart" is one word as a brand, so this slug gets guessed/typed often.
[[redirects]]
  from = "/migration/from-solidstart"
  to = "/migration/from-solid-start"
  status = 301

# observeServerFunctionCalls was removed; calls are "call" records on OBSERVE.records.
[[redirects]]
  from = "/reference/solid-web/server-functions/observe-calls"
  to = "/reference/solid-js/advanced/diagnostics-dev-hooks/observe"
  status = 301

# Solid 2.0 docs on docs.solidjs.com (merge only once docs.solidjs.com points at
# this Netlify site). Production builds then emit docs.solidjs.com URLs in the
# sitemap and llms files and drop the `X-Robots-Tag: noindex` header that
# non-canonical hosts get. Deploy previews keep their own URL and noindex.
[context.production.environment]
  SITE_URL = "https://docs.solidjs.com"

# The release-candidate host stays as an alias: dev warnings, JSDoc links and
# older posts point at v2.solidjs.com, so send each path to its canonical page.
[[redirects]]
  from = "https://v2.solidjs.com/*"
  to = "https://docs.solidjs.com/:splat"
  status = 301
  force = true

# Solid 1 sections that 2.0 does not have moved to v1.solidjs.com with the same paths.
[[redirects]]
  from = "/solid-start"
  to = "https://v1.solidjs.com/solid-start"
  status = 301

[[redirects]]
  from = "/solid-start/*"
  to = "https://v1.solidjs.com/solid-start/:splat"
  status = 301

