<svg
	xmlns="http://www.w3.org/2000/svg"
	viewBox="0 0 1200 675"
	role="img"
	aria-labelledby="title description"
>
	<title id="title">One round trip for a mutation</title>
	<desc id="description">
		Two rows compare a form submission. Without the server-side collector,
		the browser sends the action, receives its result, the router reloads
		the affected queries, and a second request fetches the fresh data. With
		the collector, the single action response carries the fresh query
		values; the router seeds its cache from them and then resolves the
		action call, so there is no second request.
	</desc>

	<defs>
		<marker
			id="arrow"
			viewBox="0 0 10 10"
			refX="9"
			refY="5"
			markerWidth="8"
			markerHeight="8"
			orient="auto-start-reverse"
		>
			<path d="M0 0 10 5 0 10z" fill="#2563eb" />
		</marker>
		<marker
			id="arrow-dark"
			viewBox="0 0 10 10"
			refX="9"
			refY="5"
			markerWidth="8"
			markerHeight="8"
			orient="auto-start-reverse"
		>
			<path d="M0 0 10 5 0 10z" fill="#0f2b55" />
		</marker>
	</defs>

	<rect width="1200" height="675" rx="24" fill="#ffffff" />

	<g
		font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
		fill="#0f172a"
	>
		<text x="600" y="62" text-anchor="middle" font-size="36" font-weight="750">
			One round trip for a mutation
		</text>

		<!-- column headers -->
		<g text-anchor="middle" font-size="18" font-weight="700" fill="#334155">
			<text x="230" y="118">browser</text>
			<text x="970" y="118">server</text>
		</g>
		<g stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6">
			<path d="M230 130v500" />
			<path d="M970 130v500" />
		</g>

		<!-- Row 1: without collector -->
		<rect x="40" y="150" width="240" height="34" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
		<text x="160" y="173" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">
			without the collector
		</text>

		<g fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)">
			<path d="M240 215h720" />
			<path d="M960 255h-720" />
			<path d="M240 335h720" />
			<path d="M960 375h-720" />
		</g>
		<g font-size="16" fill="#334155">
			<text x="600" y="206" text-anchor="middle">POST /_server: the action</text>
			<text x="600" y="278" text-anchor="middle">action result</text>
			<text x="600" y="326" text-anchor="middle">GET: reload the affected queries</text>
			<text x="600" y="398" text-anchor="middle">fresh query values</text>
		</g>
		<rect x="60" y="284" width="340" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" />
		<text x="230" y="304" text-anchor="middle" font-size="14" fill="#475569">
			router revalidates the affected queries
		</text>
		<text x="1160" y="298" text-anchor="end" font-size="15" font-weight="650" fill="#1d4ed8">
			2 requests
		</text>

		<!-- Row 2: with collector -->
		<rect x="40" y="430" width="240" height="34" rx="8" fill="#0f2b55" />
		<text x="160" y="453" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">
			with the collector
		</text>

		<g fill="none" stroke="#0f2b55" stroke-width="3" marker-end="url(#arrow-dark)">
			<path d="M240 495h720" />
			<path d="M960 575h-720" />
		</g>
		<text x="600" y="486" text-anchor="middle" font-size="16" fill="#334155">
			POST /_server: the action
		</text>

		<rect x="700" y="510" width="440" height="48" rx="10" fill="#f8fafc" stroke="#0f2b55" stroke-width="2" />
		<text x="920" y="530" text-anchor="middle" font-size="14" font-weight="650" fill="#0f2b55">
			collector runs the preloads for the next URL
		</text>
		<text x="920" y="549" text-anchor="middle" font-size="14" fill="#475569">
			and folds every query result into the response
		</text>

		<text x="600" y="598" text-anchor="middle" font-size="16" fill="#334155">
			action result + fresh query values
		</text>

		<rect x="60" y="606" width="340" height="30" rx="8" fill="#f8fafc" stroke="#0f2b55" stroke-width="1.5" />
		<text x="230" y="626" text-anchor="middle" font-size="14" fill="#0f2b55">
			router seeds its cache, then resolves the call
		</text>
		<text x="1160" y="578" text-anchor="end" font-size="15" font-weight="650" fill="#0f2b55">
			1 request
		</text>
	</g>
</svg>
